# Local production-like stack: PostgreSQL + web + worker.
# Secrets come from .env (copy .env.example); nothing secret is defined here.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crosspost
      POSTGRES_USER: crosspost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosspost"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crosspost:${POSTGRES_PASSWORD}@db:5432/crosspost
    command: ["python", "-m", "crosspost.cli", "migrate"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crosspost:${POSTGRES_PASSWORD}@db:5432/crosspost
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crosspost:${POSTGRES_PASSWORD}@db:5432/crosspost
    command: ["python", "-m", "crosspost.cli", "worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
volumes:
  pgdata:
