{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block body %}
<main class="container">
  <div class="panel">
    <h1>{{ 'Not found' if status == 404 else ('Access denied' if status == 403 else 'Something went wrong') }}</h1>
    <p>{{ detail }}</p>
    <p><a href="{{ '/admin' if user else '/listings' }}">Go back</a></p>
  </div>
</main>
{% endblock %}
